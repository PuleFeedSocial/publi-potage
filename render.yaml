services:
  - type: web
    name: publi-potage
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: publi-potage-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: publi-potage-db
    databaseName: publi_potage
    plan: free
