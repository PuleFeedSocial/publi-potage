<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Potage SRL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="view-login" class="auth-view">
        <div class="auth-form-container">
            <div class="auth-card">
                <div class="auth-card-header">
                    <div class="auth-logo">
                        <a href="index.html" class="text-decoration-none text-dark">
                            <i class="bi bi-layers-half fs-3"></i>
                        </a>
                    </div>
                    <h2>Iniciar Sesión</h2>
                    <p class="text-muted">Ingresá tus credenciales para acceder al dashboard</p>
                </div>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Correo Electrónico</label>
                        <input type="email" id="login-email" class="form-control custom-input" placeholder="tu@correo.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium text-secondary">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="login-password" class="form-control custom-input" placeholder="••••••••" required minlength="6">
                            <button class="btn btn-outline-secondary password-toggle" type="button" onclick="togglePassword('login-password', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-action-primary w-100">Acceder al Dashboard</button>
                </form>
                <div class="auth-card-footer">
                    ¿No tenés cuenta? <a href="register.html">Registrate</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (getCurrentSession()) {
                window.location.href = 'dashboard.html';
            }
        });
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        }
    </script>
</body>

</html>
