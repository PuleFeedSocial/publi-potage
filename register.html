<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crear Cuenta — Potage SRL</title>
    <link rel="icon" type="image/png" href="img/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="assets/css/pages/register.css">
</head>

<body>



    <div id="view-register" class="auth-view">
        <div class="auth-form-container">
            <div class="auth-card">
<div class="register-toolbar"><a href="index.html">← Volver al inicio</a>    <button data-page-event="register-1" type="button" class="theme-toggle-btn-floating" title="Cambiar tema" aria-label="Cambiar entre modo claro y oscuro">
        <i class="bi bi-moon-stars-fill theme-toggle-icon"></i>
    </button></div>
                <div class="auth-card-header">
                    <div class="auth-logo">
                        <a href="index.html" class="text-decoration-none text-dark">
                            <img src="img/isotiposinfondo.png" alt="Potage" class="logo-img-lg">
                        </a>
                    </div>
                    <h2>Crear Cuenta</h2>
                    <p class="text-muted">Registrate para acceder al panel de marketing</p>
                </div>

                <div class="alert-custom p-2 mb-3 text-start alert-soft border rounded-3">
                    <span class="fw-semibold fs-7"><i class="bi bi-key-fill me-1"></i> Código de activación:</span>
                    <span class="small text-muted"> Solicitá al administrador tu código de 6 dígitos. Guardalo: también verifica cambios en tu perfil y permite recuperar tu contraseña.</span>
                </div>

                <form data-page-event="register-2" id="register-form">
<div class="register-fields">
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary" for="reg-name">Nombre Completo</label>
                        <input type="text" id="reg-name" autocomplete="name" class="form-control custom-input" placeholder="Ej. Juan Pérez" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary" for="reg-email">Correo Electrónico</label>
                        <input type="email" id="reg-email" autocomplete="email" class="form-control custom-input" placeholder="tu@correo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary" for="reg-password">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="reg-password" autocomplete="new-password" class="form-control custom-input" placeholder="Mínimo 6 caracteres" required minlength="6">
                            <button data-page-event="register-3" aria-label="Mostrar contraseña" class="btn btn-outline-secondary password-toggle" type="button">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium text-secondary" for="reg-code">
                            Código de Activación
                            <span class="text-accent">(6 dígitos)</span>
                        </label>
                        <input type="text" id="reg-code" class="form-control custom-input text-center font-monospace"
                            placeholder="· · · · · ·" maxlength="6" inputmode="numeric" pattern="[0-9]{6}"
                            title="Ingresá el código de 6 dígitos proporcionado por el administrador" required>

                    </div>
</div>
                        <div class="mb-2 form-check">
                            <input type="checkbox" class="form-check-input" id="accept-privacy" required>
                            <label class="form-check-label small" for="accept-privacy">
                                He leído y acepto las <a href="output/pdf/politicas-privacidad-atlas.pdf" download>Políticas de Privacidad</a>
                            </label>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="accept-terms" required>
                            <label class="form-check-label small" for="accept-terms">
                                He leído y acepto los <a href="output/pdf/terminos-condiciones-atlas.pdf" download>Términos y Condiciones</a>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-action-primary w-100">Crear Cuenta</button>
                        <div id="register-feedback" class="alert alert-danger mt-3 small" role="status" hidden></div>
                </form>
                <div class="auth-card-footer">
                    ¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a>
                </div>
                <div class="auth-card-credit">
                    <span class="text-decoration-none small text-muted">
                        <i class="bi bi-cpu atlas-credit-icon"></i>Atlas Software &amp; Diseño
                    </span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="marketing-analysis.js"></script><script src="app.js"></script>
    <script src="assets/js/pages/register.js"></script>
    <script src="assets/js/pages/register-events.js"></script>
</body>

</html>
