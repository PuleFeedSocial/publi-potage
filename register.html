<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crear Cuenta — Potage SRL</title>
    <link rel="icon" type="image/png" href="img/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
<style>
#view-register .auth-form-container { min-height:100dvh; padding:24px 16px; }
#view-register .auth-card { max-width:680px; padding:24px 32px; }
.register-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; }
.register-toolbar a { font-size:.85rem; }
#view-register .theme-toggle-btn-floating { position:static; flex:0 0 40px; }
#view-register .auth-card-header { margin-bottom:16px; }
#view-register .auth-logo { margin-bottom:8px; }
#view-register .logo-img-lg { width:40px; height:40px; object-fit:contain; }
.register-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:20px; }
#view-register .auth-card-footer { margin-top:16px; padding-top:14px; }
#view-register .auth-card-credit { margin-top:12px; }
#view-register .form-check-label { line-height:1.5; }
@media(max-width:575px){
 #view-register .auth-form-container { padding:16px 12px; }
 #view-register .auth-card { padding:20px; }
 .register-fields { grid-template-columns:minmax(0,1fr); }
}
</style>
</head>

<body>



    <div id="view-register" class="auth-view">
        <div class="auth-form-container">
            <div class="auth-card">
<div class="register-toolbar"><a href="index.html">← Volver al inicio</a>    <button type="button" class="theme-toggle-btn-floating" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar entre modo claro y oscuro">
        <i class="bi bi-moon-stars-fill theme-toggle-icon"></i>
    </button></div>
                <div class="auth-card-header">
                    <div class="auth-logo">
                        <a href="index.html" class="text-decoration-none text-dark">
                            <img src="img/isotiposinfondo.png" alt="Potage" class="logo-img-lg">
                        </a>
                    </div>
                    <h2>Crear Cuenta</h2>
                    <p class="text-muted">Registrate para acceder al panel de marketing</p>
                </div>

                <div class="alert-custom p-2 mb-3 text-start alert-soft border rounded-3">
                    <span class="fw-semibold fs-7"><i class="bi bi-key-fill me-1"></i> Código de activación:</span>
                    <span class="small text-muted"> Solicitá el código de 6 dígitos al administrador de la plataforma.</span>
                </div>

                <form id="register-form" onsubmit="handleRegister(event)">
<div class="register-fields">
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary" for="reg-name">Nombre Completo</label>
                        <input type="text" id="reg-name" autocomplete="name" class="form-control custom-input" placeholder="Ej. Juan Pérez" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary" for="reg-email">Correo Electrónico</label>
                        <input type="email" id="reg-email" autocomplete="email" class="form-control custom-input" placeholder="tu@correo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary" for="reg-password">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="reg-password" autocomplete="new-password" class="form-control custom-input" placeholder="Mínimo 6 caracteres" required minlength="6">
                            <button aria-label="Mostrar contraseña" class="btn btn-outline-secondary password-toggle" type="button" onclick="togglePassword('reg-password', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium text-secondary" for="reg-code">
                            Código de Activación
                            <span class="text-accent">(6 dígitos)</span>
                        </label>
                        <input type="text" id="reg-code" class="form-control custom-input text-center font-monospace"
                            placeholder="· · · · · ·" maxlength="6" inputmode="numeric" pattern="[0-9]{6}"
                            title="Ingresá el código de 6 dígitos proporcionado por el administrador" required>

                    </div>
</div>
                        <div class="mb-2 form-check">
                            <input type="checkbox" class="form-check-input" id="accept-privacy" required>
                            <label class="form-check-label small" for="accept-privacy">
                                He leído y acepto las <a href="politicas-privacidad.html" target="_blank" rel="noopener">Políticas de Privacidad</a>
                            </label>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="accept-terms" required>
                            <label class="form-check-label small" for="accept-terms">
                                He leído y acepto los <a href="terminos-condiciones.html" target="_blank" rel="noopener">Términos y Condiciones</a>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-action-primary w-100">Crear Cuenta</button>
                </form>
                <div class="auth-card-footer">
                    ¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a>
                </div>
                <div class="auth-card-credit">
                    <span class="text-decoration-none small text-muted">
                        <i class="bi bi-cpu atlas-credit-icon"></i>Atlas Software &amp; Diseño
                    </span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (getCurrentSession()) {
                window.location.href = 'dashboard.html';
            }
        });
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
            btn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        }
        document.getElementById('reg-code').addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '');
        });
    </script>
</body>

</html>
