<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — Potage SRL</title>
    <link rel="icon" type="image/png" href="img/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="view-register" class="auth-view">
        <div class="auth-form-container">
            <div class="auth-card">
                <div class="auth-card-header">
                    <div class="auth-logo">
                        <a href="index.html" class="text-decoration-none text-dark">
                            <img src="img/isotiposinfondo.png" alt="Potage" class="logo-img-lg">
                        </a>
                    </div>
                    <h2>Crear Cuenta</h2>
                    <p class="text-muted">Registrate para acceder al panel de marketing</p>
                </div>

                <div class="alert-custom p-3 mb-4 text-start bg-light border rounded-3">
                    <span class="fw-semibold fs-7"><i class="bi bi-key-fill me-1"></i> Código de activación:</span>
                    <span class="small text-muted"> Solicitá el código de 6 dígitos al administrador de la plataforma.</span>
                </div>

                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Nombre Completo</label>
                        <input type="text" id="reg-name" class="form-control custom-input" placeholder="Ej. Juan Pérez" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Correo Electrónico</label>
                        <input type="email" id="reg-email" class="form-control custom-input" placeholder="tu@correo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="reg-password" class="form-control custom-input" placeholder="Mínimo 6 caracteres" required minlength="6">
                            <button class="btn btn-outline-secondary password-toggle" type="button" onclick="togglePassword('reg-password', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium text-secondary">
                            Código de Activación
                            <span class="text-accent">(6 dígitos)</span>
                        </label>
                        <input type="text" id="reg-code" class="form-control custom-input text-center font-monospace"
                            placeholder="· · · · · ·" maxlength="6" inputmode="numeric" pattern="[0-9]{6}"
                            title="Ingresá el código de 6 dígitos proporcionado por el administrador" required>
                        <small class="text-muted small mt-1 d-block">
                            Este código lo otorga el administrador de Potage SRL.
                        </small>
                    </div>
                    <button type="submit" class="btn btn-action-primary w-100">Crear Cuenta</button>
                </form>
                <div class="auth-card-footer">
                    ¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (getCurrentSession()) {
                window.location.href = 'dashboard.html';
            }
        });
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        }
        document.getElementById('reg-code').addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '');
        });
    </script>
</body>

</html>
